# Workflow reutilizável: build de uma imagem Docker e push para o GHCR.
#
# Roda em runner do GitHub (ubuntu-latest), nunca no servidor.
# A imagem fica em ghcr.io/<org>/<image>:<tag>, ligada ao repositório que chamou
# (label org.opencontainers.image.source), o que dá acesso de leitura ao GITHUB_TOKEN dele.
#
# O job que chama precisa de:
#   permissions:
#     contents: read
#     packages: write
name: Build e push de imagem

on:
  workflow_call:
    inputs:
      image:
        description: Nome da imagem, sem registry (ex. hvu-backend)
        required: true
        type: string
      context:
        description: Diretório de build (ex. back)
        required: true
        type: string
      file:
        description: Dockerfile, relativo à raiz do repositório (padrão <context>/Dockerfile)
        required: false
        type: string
        default: ""
      tag:
        description: Tag da imagem (ex. o SHA do commit)
        required: true
        type: string
      build-args:
        description: Build args não sensíveis, um por linha (CHAVE=valor)
        required: false
        type: string
        default: ""
    secrets:
      build-secret-args:
        description: Build args sensíveis, um por linha (CHAVE=valor)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ${{ inputs.build-args }}
            ${{ secrets.build-secret-args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
